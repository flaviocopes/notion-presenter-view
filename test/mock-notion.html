<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Q4 Planning</title>
<!--
  A stand-in for a Notion page in presentation mode. The presentation DOM
  mirrors what Notion's PagePresentationMode chunk renders: a fixed
  [data-presentation-mode] root, the previous, current and next slide in
  [data-slide-index] wrappers, the 800px slide scaled with a transform, and a
  controls bar with a tabular-nums "N of M" counter. Shortcuts match on
  keyCode like Notion's.
-->
<style>
  .notion-light-theme {
    color-scheme: light;
    --c-bacPri: #ffffff;
    --c-bacSec: rgb(248, 248, 247);
    --c-texPri: rgb(44, 44, 43);
    --c-texSec: rgb(115, 114, 110);
    --c-bluTexAccPri: rgb(35, 131, 226);
  }
  body { margin: 0; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; }
  .notion-app-inner { background: var(--c-bacPri); color: var(--c-texPri); min-height: 100vh; }
  .page { width: 708px; margin: 0 auto; padding: 80px 0; }
  .page h1 { font-size: 40px; margin: 0 0 24px; }
  .page hr { border: 0; border-top: 1px solid rgba(55, 53, 47, 0.16); margin: 16px 0; }
  .notion-callout-block { display: flex; gap: 8px; padding: 16px 16px 16px 12px; border-radius: 10px; background: var(--c-bacSec); }
</style>
</head>
<body>
<div class="notion-app-inner notion-light-theme">
  <div class="page" id="page"></div>
</div>
<script>
  const pageTitle = 'Q4 Planning'
  const pageIcon = '🚀'
  const sections = [
    `<div class="notion-selectable notion-header-block"><h2 style="font-size:1.875em;font-weight:600;line-height:1.3;margin:0 0 8px">Where we are</h2></div>
     <div class="notion-selectable notion-text-block"><div style="padding:3px 2px">We shipped three of the four Q3 goals.</div></div>
     <ul style="margin:0;padding-left:24px">
       <li style="padding:3px 0">New onboarding flow is live</li>
       <li style="padding:3px 0">Billing moved to annual plans</li>
       <li style="padding:3px 0">Mobile app beta reached 2,000 users</li>
     </ul>`,
    `<div class="notion-selectable notion-header-block"><h2 style="font-size:1.875em;font-weight:600;line-height:1.3;margin:0 0 8px">What we learned</h2></div>
     <div class="notion-selectable notion-callout-block"><span>💡</span><div style="color:var(--c-texSec)">Customers who finish onboarding in one session are 3x more likely to upgrade.</div></div>
     <div class="notion-selectable notion-image-block" style="margin-top:12px"><img src="/images/chart.svg" alt="Upgrade rate chart" style="width:100%;display:block;border-radius:4px"></div>`,
    `<div class="notion-selectable notion-header-block"><h2 style="font-size:1.875em;font-weight:600;line-height:1.3;margin:0 0 8px">Q4 goals</h2></div>
     <ol style="margin:0;padding-left:24px">
       <li style="padding:3px 0">Cut onboarding to under 5 minutes</li>
       <li style="padding:3px 0">Launch the mobile app publicly</li>
       <li style="padding:3px 0">Reach 40% annual plan adoption</li>
     </ol>
     <div class="notion-selectable notion-embed-block" style="height:200px;margin-top:12px"><iframe src="/embed/roadmap" style="width:100%;height:100%;border:0"></iframe></div>`,
    `<div class="notion-selectable notion-header-block" style="text-align:center"><h2 style="font-size:2.5em;font-weight:700;margin:0">Thanks! Questions?</h2></div>`,
  ]

  document.getElementById('page').innerHTML =
    `<h1>${pageIcon} ${pageTitle}</h1>` + sections.join('<hr class="notion-divider-block">')

  const slides = [{ type: 'title' }, ...sections.map((html) => ({ type: 'content', html }))]
  let current = 0
  let root = null

  function slideHtml(slide) {
    if (slide.type === 'title') {
      return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:56px;font-family:inherit">
        <div style="font-size:64px;line-height:1">${pageIcon}</div>
        <div style="font-size:40px;font-weight:700;text-align:center">${pageTitle}</div>
      </div>`
    }
    return `<div style="display:flex;flex-direction:column;gap:8px;padding:56px;font-family:inherit">${slide.html}</div>`
  }

  function render() {
    const first = Math.max(0, current - 1)
    const last = Math.min(slides.length - 1, current + 1)
    let html = ''
    for (let i = first; i <= last; i++) {
      const active = i === current
      const style = active
        ? 'width:100%;position:relative;visibility:visible;pointer-events:auto;opacity:1;transition:opacity 0.3s ease;will-change:opacity'
        : 'width:100%;position:absolute;inset:0;pointer-events:none;visibility:hidden;opacity:0;transition:none;overflow:hidden'
      html += `<div aria-hidden="${!active}" data-slide-index="${i}" style="${style}"${active ? '' : ' inert'}>
        <div style="width:800px;margin:auto">
          <div style="width:800px;transform-origin:top left">
            <div>${slideHtml(slides[i])}</div>
          </div>
        </div>
      </div>`
    }
    root.querySelector('.slides').innerHTML = html
    root.querySelector('[style*="tabular-nums"]').textContent = `${current + 1} of ${slides.length}`

    for (const wrapper of root.querySelectorAll('[data-slide-index]')) {
      const outer = wrapper.firstElementChild
      const scaler = outer.firstElementChild
      const height = scaler.firstElementChild.offsetHeight
      const fill = height > 0 ? (innerHeight - 80) / height : innerWidth / 800
      const scale = Math.round(1000 * Math.max(1, Math.min(innerWidth / 800, fill))) / 1000
      scaler.style.transform = `scale(${scale})`
      outer.style.width = `${800 * scale}px`
      outer.style.height = `${height * scale}px`
    }
  }

  function openPresentation() {
    if (root) return
    root = document.createElement('div')
    root.setAttribute('data-presentation-mode', 'true')
    root.style.cssText = 'position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;color:var(--c-texPri);overflow-x:hidden;overscroll-behavior:none;background-color:var(--c-bacPri);overflow-y:auto'
    root.innerHTML = `
      <div class="slides" style="position:relative;display:flex;flex:1;flex-direction:column;justify-content:center;width:100%"></div>
      <div style="position:fixed;bottom:24px;width:100%;display:flex;flex-direction:column;align-items:center;pointer-events:none">
        <div style="pointer-events:auto;display:flex;align-items:center;gap:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,0.1);border-radius:12px;padding:4px 8px">
          <div style="padding-inline: 4px; font-variant-numeric: tabular-nums;"></div>
        </div>
      </div>`
    document.querySelector('.notion-app-inner').append(root)
    current = 0
    render()
    document.documentElement.requestFullscreen?.().catch(() => {})
  }

  function closePresentation() {
    root?.remove()
    root = null
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {})
  }

  function go(index) {
    if (index < 0 || index >= slides.length || index === current) return
    current = index
    render()
  }

  // Notion's "command+alt+p" means the Command key on a Mac and Ctrl elsewhere
  const isApple = /Mac|iPhone|iPad/.test(navigator.platform)
  const isPresentShortcut = (event) =>
    event.keyCode === 80 && event.altKey && !event.shiftKey &&
    (isApple ? event.metaKey && !event.ctrlKey : event.ctrlKey)

  window.addEventListener('keydown', (event) => {
    if (isPresentShortcut(event)) {
      event.preventDefault()
      openPresentation()
      return
    }
    if (!root) return
    if ([39, 32, 34].includes(event.keyCode)) go(current + 1)
    else if ([37, 33].includes(event.keyCode)) go(current - 1)
    else if (event.keyCode === 82) go(0)
    else if (event.keyCode === 27) {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {})
      else closePresentation()
    }
  }, true)

  window.addEventListener('resize', () => root && render())
</script>
</body>
</html>
